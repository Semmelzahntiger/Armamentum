pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Annotation processor that generates InstanceEventDistributor.
// Kept in its own module because a processor has to be compiled before the sources it processes.
include 'processor'
